<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tobi + Bob Kanban</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { 
      text-align: center; 
      margin-bottom: 20px;
      color: #58a6ff;
    }
    .board {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 20px;
    }
    .column {
      background: #161b22;
      border-radius: 8px;
      min-width: 280px;
      max-width: 280px;
      padding: 12px;
      border: 1px solid #30363d;
    }
    .column-header {
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .column-count {
      background: #30363d;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }
    .card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: #58a6ff;
    }
    .card-title {
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .card-title a {
      color: #c9d1d9;
      text-decoration: none;
    }
    .card-title a:hover {
      color: #58a6ff;
    }
    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .label {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .refresh-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #238636;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .refresh-btn:hover {
      background: #2ea043;
    }
    .project-labels {
      margin-bottom: 4px;
    }
    .status-labels {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>🎯 Tobi + Bob Kanban</h1>
  <div id="board" class="board">
    <div class="loading">Loading issues...</div>
  </div>
  <button class="refresh-btn" onclick="loadIssues()">↻ Refresh</button>

  <script>
    const REPO = 'oluwabigtobi/tobi-bob-projects';
    const STATUS_COLUMNS = ['backlog', 'this-week', 'in-progress', 'waiting', 'done'];
    const PROJECT_LABELS = ['momentum', 'levity', 'post-street', 'bob-tasks'];
    
    const LABEL_COLORS = {
      'momentum': '#1d76db',
      'levity': '#0e8a16',
      'post-street': '#d93f0b',
      'bob-tasks': '#7057ff',
      'backlog': '#e4e669',
      'this-week': '#fbca04',
      'in-progress': '#c2e0c6',
      'waiting': '#fef2c0',
      'done': '#cccccc'
    };

    const COLUMN_NAMES = {
      'backlog': '📋 Backlog',
      'this-week': '🎯 This Week',
      'in-progress': '🔨 In Progress',
      'waiting': '⏳ Waiting',
      'done': '✅ Done'
    };

    async function loadIssues() {
      const board = document.getElementById('board');
      board.innerHTML = '<div class="loading">Loading issues...</div>';

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100`);
        const issues = await response.json();

        const columns = {};
        STATUS_COLUMNS.forEach(status => {
          columns[status] = [];
        });

        issues.forEach(issue => {
          if (issue.pull_request) return; // Skip PRs
          
          const labels = issue.labels.map(l => l.name.toLowerCase());
          let status = 'backlog'; // default
          
          for (const s of STATUS_COLUMNS) {
            if (labels.includes(s)) {
              status = s;
              break;
            }
          }
          
          columns[status].push(issue);
        });

        board.innerHTML = STATUS_COLUMNS.map(status => `
          <div class="column">
            <div class="column-header">
              <span>${COLUMN_NAMES[status]}</span>
              <span class="column-count">${columns[status].length}</span>
            </div>
            <div class="cards">
              ${columns[status].map(issue => renderCard(issue)).join('')}
            </div>
          </div>
        `).join('');

      } catch (error) {
        board.innerHTML = `<div class="loading">Error loading issues: ${error.message}</div>`;
      }
    }

    function renderCard(issue) {
      const labels = issue.labels.map(l => l.name.toLowerCase());
      const projectLabels = labels.filter(l => PROJECT_LABELS.includes(l));
      const otherLabels = labels.filter(l => !STATUS_COLUMNS.includes(l) && !PROJECT_LABELS.includes(l));

      return `
        <div class="card">
          <div class="card-title">
            <a href="${issue.html_url}" target="_blank">${issue.title}</a>
          </div>
          <div class="labels project-labels">
            ${projectLabels.map(l => `
              <span class="label" style="background: ${LABEL_COLORS[l] || '#30363d'}; color: ${getContrastColor(LABEL_COLORS[l])}">${l}</span>
            `).join('')}
          </div>
        </div>
      `;
    }

    function getContrastColor(hexcolor) {
      if (!hexcolor) return '#000';
      const r = parseInt(hexcolor.slice(1,3), 16);
      const g = parseInt(hexcolor.slice(3,5), 16);
      const b = parseInt(hexcolor.slice(5,7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.5 ? '#000' : '#fff';
    }

    loadIssues();
  </script>
</body>
</html>
